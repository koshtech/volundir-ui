{{if user_loggedin == 'true'}}
  <h1>Welcome, {{user.name}}!</h1>
{{endif}}

<div class="row">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card">
      <div class="card-content">
        <div class="card-title">
          Home Page
          <button class="close-btn">&times;</button>
        </div>
        <div class="card-body page-content">
          <h3 class="mb-3">Formulário de Exemplo</h3>
          <p class="mb-3">Este é um exemplo de card com conteúdo.</p>

          <form>
            <div class="form-group">
              <label for="inputName">Nome:</label>
              <input type="text" id="inputName" class="form-control" placeholder="Seu nome">
            </div>
            <div class="form-group">
              <label for="inputEmail">Email:</label>
              <input type="email" id="inputEmail" class="form-control" placeholder="seu@email.com">
            </div>
            <div class="form-group">
              <label for="selectOption">Selecione uma opção:</label>
              <select id="selectOption" class="form-control">
                <option value="">Selecione...</option>
                <option value="1">Opção 1</option>
                <option value="2">Opção 2</option>
                <option value="3">Opção 3</option>
              </select>
            </div>
            <div class="form-group">
              <label for="textareaMessage">Mensagem:</label>
              <textarea id="textareaMessage" class="form-control" rows="3" placeholder="Sua mensagem"></textarea>
            </div>
            <div class="form-group">
              <div class="form-check">
                <input type="checkbox" id="checkTerms" class="form-check-input">
                <label for="checkTerms" class="form-check-label">Aceito os termos e condições</label>
              </div>
            </div>
            <div class="form-group">
              <div class="form-check form-check-inline">
                <input type="radio" id="radioOption1" name="radioOptions" class="form-check-input" value="1">
                <label for="radioOption1" class="form-check-label">Radio 1</label>
              </div>
              <div class="form-check form-check-inline">
                <input type="radio" id="radioOption2" name="radioOptions" class="form-check-input" value="2">
                <label for="radioOption2" class="form-check-label">Radio 2</label>
              </div>
            </div>
            <button type="submit" class="btn btn-success">Enviar Formulário</button>
          </form>
        </div>
        <div class="card-footer">
          <nav aria-label="Page navigation example">
            <ul class="pagination">
              <li class="page-item disabled"><a class="page-link" href="#">Anterior</a></li>
              <li class="page-item active"><a class="page-link" href="#">1</a></li>
              <li class="page-item"><a class="page-link" href="#">2</a></li>
              <li class="page-item"><a class="page-link" href="#">3</a></li>
              <li class="page-item"><a class="page-link" href="#">Próximo</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </div>
  <div class="col-12 col-md-6 col-lg-8">
    <div class="row mt-3">
      <div class="col-6">
        <a href="/some_action" class="btn btn-success btn-micro">Option 1</a>
      </div>
      <div class="col-6">
        <a href="/some_action" class="btn">Option 2</a>
      </div>
    </div>
    <div class="row mt-3">
      <div class="col-6 mt-2">
        <a href="/some_action" class="btn btn-large">Option 3</a>
      </div>
      <div class="col-6">
        <a href="/some_place" title="bla">Test Link</a>
      </div>
    </div>
  </div>
</div>

<p>Location on server: /volundir-ui/app/views/site/index.html</p>
