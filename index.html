<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Volundir Application</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }

      .full-screen-overlay {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        background-color: #e0f2f7;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
      }

      .spinner-gear {
        animation: spin-clockwise 1.5s linear infinite;
        transform-origin: center center;
      }

      .spinner-container-gear {
        width: 80px;
        height: 80px;
        display: block;
        margin-bottom: 30px;
      }

      .spinner-container-gear svg {
        width: 100%;
        height: 100%;
      }

      .spinner-container-gear path {
        fill: #2c3e50;
      }

      .full-screen-overlay p {
        font-family: sans-serif;
        color: #2c3e50;
        font-size: 1.2em;
        margin: 0;
      }

      @keyframes spin-clockwise {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>

  </head>
  <body>
    <div class="full-screen-overlay">
      <div class="spinner-container-gear">
        <svg class="spinner-gear" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M50,0 A50,50 0 0,0 0,50 A50,50 0 0,0 50,100 A50,50 0 0,0 100,50 A50,50 0 0,0 50,0 Z M50,15 A35,35 0 1,1 50,85 A35,35 0 1,1 50,15 Z M50,40 L55,40 L55,30 L65,30 L65,40 L70,40 L70,50 L65,50 L65,60 L55,60 L55,50 L50,50 Z M40,50 L45,50 L45,60 L35,60 L35,50 L30,50 L30,40 L35,40 L35,30 L45,30 L45,40 L40,40 Z M50,70 L55,70 L55,65 L65,65 L65,70 L70,70 L70,75 L65,75 L65,80 L55,80 L55,75 L50,75 Z M40,75 L45,75 L45,80 L35,80 L35,75 L30,75 L30,70 L35,70 L35,65 L45,65 L45,70 L40,70 Z M70,50 L75,50 L75,45 L85,45 L85,50 L90,50 L90,55 L85,55 L85,60 L75,60 L75,55 L70,55 Z M10,50 L15,50 L15,55 L25,55 L25,50 L30,50 L30,45 L25,45 L25,40 L15,40 L15,45 L10,45 Z" />
        </svg>
      </div>

      <p>Loading Volundir Application...</p>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
