<div class="form-check">
  <input type="checkbox" id="{{field.name}}" name="{{field.name}}" class="form-check-input"
         {{if field.value == "true"}}checked{{endif}} {{if field.disabled}}disabled{{endif}}>
  <label class="form-check-label" for="{{field.name}}">{{field.name | capitalize}}</label>
</div>
